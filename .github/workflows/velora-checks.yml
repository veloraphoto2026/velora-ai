name: Velora safe checks
on:
  push:
    branches: [feature/account-ui-safe, fix/account-credit-security]
  pull_request:
    branches: [main, feature/account-ui-safe]
jobs:
  account-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check server and frontend syntax
        run: |
          node --check server.js
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline scripts found');
          for (const [, script] of scripts) new vm.Script(script);
          NODE
      - name: Isolated PostgreSQL integration tests with fake Replicate
        run: npm test
