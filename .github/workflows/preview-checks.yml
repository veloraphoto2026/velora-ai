name: Preview checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/auth-credits-safe-preview]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --check server.js
