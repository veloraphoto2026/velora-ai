name: Preview checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/auth-credits-safe-preview]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velora_test
          POSTGRES_PASSWORD: velora_test_password
          POSTGRES_DB: velora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velora_test -d velora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://velora_test:velora_test_password@localhost:5432/velora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --check server.js
