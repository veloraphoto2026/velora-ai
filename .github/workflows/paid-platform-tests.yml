name: Paid platform tests
on:
  push:
    branches: [feature/ranvik-paid-platform]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --check server.js
      - run: node --check src/payments/tbank-webhook.js
