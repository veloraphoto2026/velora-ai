name: Staging checks
on:
  push:
    branches:
      - velora-staging-safe-20261025
      - velora-integration-safe-20261025
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velora_test
          POSTGRES_PASSWORD: test_password_only
          POSTGRES_DB: velora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velora_test -d velora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://velora_test:test_password_only@127.0.0.1:5432/velora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
